<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>백남준 TV 퍼즐</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&family=VT323&display=swap">
<style>
/* Layout: dark gallery stage with HUD corners (score left, shapes right); TV tray, then rotate/attach row, then submit row. Single dark-gallery world; accents taken from SMPTE colour bars. */
:root {
  --bg: #0c0b10;
  --panel: #17151f;
  --line: #2a2735;
  --text: #f1ede4;
  --muted: #9a94a8;
  --yellow: #f5d000;
  --cyan: #3fd0e0;
  --good: #39e07a;
  --bad: #ff4466;
  --display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --body: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
  --crt: "VT323", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--text); }
body {
  font-family: var(--body);
  padding-block: 22px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 5vw, 40px); margin: 0; }
.bars { display: inline-flex; height: 10px; margin-left: 10px; vertical-align: middle; border-radius: 2px; overflow: hidden; }
.bars i { width: 10px; }
.rule { font-size: 13px; color: var(--muted); }

.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden; background: #08070b; border: 1px solid var(--line); touch-action: none; }
@media (max-width: 600px) { .stage { aspect-ratio: 1 / 1; } }
#cv { display: block; width: 100%; height: 100%; }
.hud { position: absolute; top: 12px; display: grid; gap: 0; pointer-events: none; }
.hud.l { left: 14px; } .hud.r { right: 14px; text-align: right; }
.hud small { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
.hud b { font-family: var(--crt); font-weight: 400; font-size: clamp(34px, 6vw, 48px); line-height: 0.9; font-variant-numeric: tabular-nums; }
.hud.l b { color: var(--yellow); } .hud.r b { color: var(--cyan); }
.flash { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; }
.flash.show { opacity: 1; }
.flash strong { font-family: var(--crt); font-weight: 400; font-size: clamp(56px, 12vw, 104px); letter-spacing: 0.06em; line-height: 1; text-shadow: 0 0 24px currentColor; }
.flash span { font-size: 15px; font-weight: 600; color: var(--text); }
.flash.good strong { color: var(--good); } .flash.bad strong { color: var(--bad); }
.status { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px; font-size: 13px; background: linear-gradient(transparent, rgba(8,7,11,.9)); pointer-events: none; }

.tray { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.tv {
  display: grid; gap: 2px; padding: 9px 10px; text-align: left; cursor: pointer; border-radius: 6px;
  background: var(--panel); color: var(--text); border: 1px solid var(--line); font-family: var(--body);
}
.tv b { font-family: var(--crt); font-weight: 400; font-size: 22px; line-height: 1; }
.tv span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tv.on { border-color: var(--yellow); box-shadow: inset 0 0 0 1px var(--yellow); }
.tv.done { opacity: .38; cursor: default; }
.tv.done b::after { content: " ✓"; font-size: 16px; color: var(--good); }
@media (max-width: 520px) { .tv span { display: none; } .tv { text-align: center; } }

.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row button {
  font-family: var(--body); font-size: 14px; font-weight: 600; padding: 11px 16px; border-radius: 6px; cursor: pointer;
  background: var(--panel); color: var(--text); border: 1px solid var(--line); flex: 1 1 auto;
}
.row button:hover:not(:disabled) { border-color: var(--muted); }
.row button:disabled { opacity: .35; cursor: default; }
.row .primary { background: var(--yellow); color: #14120a; border-color: var(--yellow); }
.row .correct { background: var(--good); color: #06180d; border-color: var(--good); font-family: var(--crt); font-size: 26px; font-weight: 400; letter-spacing: .08em; padding: 4px 16px; flex: 2 1 160px; }
.row .warn { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* jackpot */
.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.flash em { font-family: var(--crt); font-style: normal; font-size: clamp(64px, 16vw, 150px); line-height: .9; color: var(--yellow); text-shadow: 0 0 30px rgba(245, 208, 0, .7); }
.flash em:empty { display: none; }
.flash.win strong { color: var(--cyan); }
.flash.win.t10 strong { color: var(--yellow); }
.flash.win.t10 em { color: #fff; text-shadow: 0 0 18px var(--yellow), 0 0 50px #ff4466; }
.flash.show.win em { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
.jp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.jp > span:first-child { font-weight: 600; letter-spacing: .08em; }
.jp b { font-family: var(--crt); font-weight: 400; font-size: 20px; color: var(--text); margin-right: 3px; }
.jp .top b { color: var(--yellow); }
.jp .gone { opacity: .35; }
@media (prefers-reduced-motion: reduce) { .flash.show.win em { animation: none; } }
</style>

<div class="wrap">
  <header>
    <h1>백남준 TV 퍼즐<span class="bars" aria-hidden="true"><i style="background:#c0c0c0"></i><i style="background:#f5d000"></i><i style="background:#3fd0e0"></i><i style="background:#39e07a"></i><i style="background:#d040c0"></i><i style="background:#ff4466"></i><i style="background:#2040d0"></i></span></h1>
    <div class="rule">TV 5대를 면끼리 붙여 새 모양을 만드세요. 이미 낸 모양을 또 내면 감점이에요.</div>
  </header>

  <div class="stage">
    <canvas id="cv" aria-label="TV 조형물을 만드는 3D 작업대"></canvas>
    <div class="hud l"><small>SCORE</small><b id="score">0</b></div>
    <div class="hud r"><small>만든 모양</small><b id="shapes">0</b></div>
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <div class="flash" id="flash"><strong id="flashT">CORRECT</strong><em id="flashM"></em><span id="flashS"></span></div>
    <div class="status" id="status"></div>
  </div>

  <div class="jp" id="jp" aria-label="남은 숨은 잭팟"></div>

  <div class="tray" id="tray"></div>

  <div class="row">
    <button id="rotY">⟲ 좌우 회전</button>
    <button id="rotX">⤒ 상하 회전</button>
    <button id="attach" class="primary">붙이기</button>
    <button id="undo">되돌리기</button>
  </div>
  <div class="row">
    <button id="correct" class="correct">CORRECT</button>
    <button id="clear">판 비우기</button>
    <button id="reset" class="warn">리셋</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  // ================= 잭팟 설정 · 이 숫자만 바꾸면 돼요 =================
  // JACKPOT_FACTOR: 모든 확률에 곱하는 배율 (1 = 아래 값 그대로, 2 = 두 배, 0.5 = 절반)
  // chance: 숨은 배치 1개가 새 모양 제출 1회에 걸릴 확률
  // count: 게임 시작·리셋 때 깔리는 개수 / mult: 기본 10점에 곱하는 배수
  const JACKPOT_FACTOR = 1;
  const JACKPOT_TIERS = [
    { mult: 2,  count: 10, chance: 1 / 8 },
    { mult: 4,  count: 8,  chance: 1 / 20 },
    { mult: 8,  count: 4,  chance: 1 / 60 },
    { mult: 10, count: 1,  chance: 1 / 100 }
  ];
  // ===================================================================
  // ---------- rules & math ----------
  const DIMS = [[12, 10, 10], [10, 8, 8], [8, 6, 6], [6, 4, 4], [4, 4, 4]]; // w,h,d — even so every centre lands on the grid
  const NAMES = ['XL', 'L', 'M', 'S', 'XS'];
  const PROG = ['컬러바', '노이즈', '자석 TV', '달', '리사주'];
  const FACE = { '1,0,0': '다이얼면', '-1,0,0': '스피커면', '0,1,0': '윗면', '0,-1,0': '밑면', '0,0,1': '화면', '0,0,-1': '뒤판' };
  const I = [1,0,0, 0,1,0, 0,0,1], RY = [0,0,1, 0,1,0, -1,0,0], RX = [1,0,0, 0,0,-1, 0,1,0];
  const mul = (A, B) => { const C = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) C[i*3+j] = A[i*3]*B[j] + A[i*3+1]*B[3+j] + A[i*3+2]*B[6+j]; return C; };
  const mv = (A, v) => [0, 1, 2].map(r => A[r*3]*v[0] + A[r*3+1]*v[1] + A[r*3+2]*v[2]);
  const mtv = (A, v) => [0, 1, 2].map(c => A[c]*v[0] + A[3+c]*v[1] + A[6+c]*v[2]);
  const half = (O, d) => [0, 1, 2].map(r => (Math.abs(O[r*3])*d[0] + Math.abs(O[r*3+1])*d[1] + Math.abs(O[r*3+2])*d[2]) / 2);
  // the 24 rotations of a box, generated from the two moves the player has
  const G = (() => { const seen = new Map([[I.join(), I]]), q = [I]; while (q.length) { const m = q.shift(); for (const g of [RY, RX]) { const n = mul(g, m); const k = n.join(); if (!seen.has(k)) { seen.set(k, n); q.push(n); } } } return [...seen.values()]; })();

  // same shape = same after turning the whole sculpture; a mirror image counts as new
  function signature(list) {
    let best = null;
    for (const R of G) {
      const t = list.map(x => ({ id: x.id, O: mul(R, x.O), p: mv(R, x.p) })).sort((a, b) => a.id - b.id);
      const b = t[0].p;
      const s = t.map(x => `${x.id}:${x.p.map((v, i) => v - b[i]).join(',')}:${x.O.join(',')}`).join('|');
      if (best === null || s < best) best = s;
    }
    return best;
  }

  // ---------- hidden jackpots ----------
  // Each jackpot is a hidden random set of sculptures, drawn fresh at game start and on reset.
  // A sculpture belongs to it when hash(jackpot seed + sculpture shape) falls under the tier's chance,
  // so the same shape always gives the same answer, and the odds equal JACKPOT_TIERS[].chance × JACKPOT_FACTOR exactly.
  const TIERS = JACKPOT_TIERS.map(t => ({ m: t.mult, n: t.count, p: Math.min(1, t.chance * JACKPOT_FACTOR) }));
  const CONFIG_ID = JSON.stringify(TIERS);
  const makeJackpots = () => TIERS.flatMap(t => Array.from({ length: t.n }, () => ({ m: t.m, seed: (Math.random() * 2 ** 32) >>> 0, hit: false })));
  function roll(seed, shape) { // FNV-1a → 0..1
    let h = 0x811c9dc5 ^ seed;
    for (let i = 0; i < shape.length; i++) { h ^= shape.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13;
    return (h >>> 0) / 2 ** 32;
  }
  const tierOf = m => TIERS.find(t => t.m === m);

  // ---------- saved progress (this browser only) ----------
  const KEY = 'paik-tv-puzzle-v1';
  let score = 0, hist = [], jackpots = null, configId = null;
  try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) { score = d.score || 0; hist = d.hist || []; jackpots = d.jackpots || null; configId = d.configId || null; } } catch (e) {}
  // new game, older save, or the settings above were edited → draw a fresh set
  if (!jackpots || configId !== CONFIG_ID || jackpots.some(j => j.seed === undefined)) jackpots = makeJackpots();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ score, hist, jackpots, configId: CONFIG_ID })); } catch (e) {} };
  save();

  // ---------- three.js scene ----------
  const cv = document.getElementById('cv');
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0a10);
  scene.fog = new THREE.Fog(0x0b0a10, 90, 170);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
  camera.position.set(38, 30, 52);
  const controls = new THREE.OrbitControls(camera, cv);
  controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 25; controls.maxDistance = 120;
  scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x251a20, 0.75));
  const key = new THREE.DirectionalLight(0xfff1dd, 0.85); key.position.set(30, 50, 40); scene.add(key);
  const rim = new THREE.DirectionalLight(0x5fd0ff, 0.35); rim.position.set(-40, 10, -30); scene.add(rim);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: 0x15131c, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -24; scene.add(floor);
  const ring = new THREE.Mesh(new THREE.RingGeometry(20, 20.4, 64), new THREE.MeshBasicMaterial({ color: 0x2a2735 }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = -23.9; scene.add(ring);

  // ---------- textures ----------
  const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t; };
  const wood = (g, w, h, base) => { g.fillStyle = base; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1; for (let y = 3; y < h; y += 5) { g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= w; x += 16) g.lineTo(x, y + Math.sin(x * .05 + y) * 1.5); g.stroke(); } };
  const knob = (g, x, y, r, a) => { g.fillStyle = '#1b1714'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.strokeStyle = '#c9b48a'; g.lineWidth = 3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r * .8, y + Math.sin(a) * r * .8); g.stroke(); };
  const TEX = {
    dial: canvasTex(128, 128, (g, w, h) => { wood(g, w, h, '#7a4e2c'); knob(g, 64, 42, 18, -0.6); knob(g, 64, 90, 13, 2.2); }),
    speaker: canvasTex(128, 128, (g, w, h) => { wood(g, w, h, '#6e4527'); g.fillStyle = '#2a1c12'; for (let y = 24; y < 108; y += 9) for (let x = 24; x < 108; x += 9) { g.beginPath(); g.arc(x, y, 2.6, 0, 7); g.fill(); } }),
    top: canvasTex(128, 128, (g, w, h) => { wood(g, w, h, '#8f5f37'); g.fillStyle = '#2a1c12'; for (let x = 22; x < 110; x += 12) g.fillRect(x, 50, 5, 28); }),
    bottom: canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#26201d'; g.fillRect(0, 0, w, h); g.fillStyle = '#0d0b0a'; for (const [x, y] of [[20, 20], [108, 20], [20, 108], [108, 108]]) { g.beginPath(); g.arc(x, y, 9, 0, 7); g.fill(); } }),
    back: canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#3a3a42'; g.fillRect(0, 0, w, h); g.fillStyle = '#1c1c22'; for (let y = 18; y < 80; y += 10) for (let x = 16; x < 112; x += 24) g.fillRect(x, y, 18, 4); g.fillStyle = '#d8d2c4'; g.fillRect(40, 94, 48, 18); g.fillStyle = '#3a3a42'; g.fillRect(44, 99, 40, 2); g.fillRect(44, 104, 28, 2); })
  };
  // the five screens, each running its own programme
  const SW = 128, SH = 96;
  const screens = DIMS.map(() => { const c = document.createElement('canvas'); c.width = SW; c.height = SH; const t = new THREE.CanvasTexture(c); return { c, g: c.getContext('2d'), t }; });
  const BAR = ['#c0c0c0', '#f5d000', '#3fd0e0', '#39e07a', '#d040c0', '#ff4466', '#2040d0'];
  function drawScreen(i, t) {
    const { g } = screens[i], x0 = 12, y0 = 10, w = SW - 24, h = SH - 20;
    g.fillStyle = '#5e3a20'; g.fillRect(0, 0, SW, SH);
    g.fillStyle = '#111'; g.fillRect(x0 - 2, y0 - 2, w + 4, h + 4);
    g.save(); g.beginPath(); g.rect(x0, y0, w, h); g.clip();
    if (i === 0) { const roll = (t * 18) % h; for (const o of [roll - h, roll]) BAR.forEach((c, k) => { g.fillStyle = c; g.fillRect(x0 + k * w / 7, y0 + o, w / 7 + 1, h); }); }
    else if (i === 1) { const im = g.createImageData(w, h); for (let p = 0; p < im.data.length; p += 4) { const v = Math.random() * 255; im.data[p] = v; im.data[p + 1] = v * .95; im.data[p + 2] = v * 1.05; im.data[p + 3] = 255; } g.putImageData(im, x0, y0); }
    else if (i === 2) { g.fillStyle = '#060410'; g.fillRect(x0, y0, w, h); for (let k = 0; k < 9; k++) { g.strokeStyle = `hsl(${(t * 60 + k * 40) % 360},90%,60%)`; g.lineWidth = 2; g.beginPath(); for (let y = 0; y <= h; y += 3) { const x = w / 2 + Math.sin(y * .08 + t * 2 + k) * (8 + k * 4) * Math.sin(t + k * .3); y === 0 ? g.moveTo(x0 + x, y0 + y) : g.lineTo(x0 + x, y0 + y); } g.stroke(); } }
    else if (i === 3) { g.fillStyle = '#05081c'; g.fillRect(x0, y0, w, h); const cx = x0 + w / 2, cy = y0 + h / 2, r = h * .32; g.fillStyle = '#f3ecd0'; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); g.fillStyle = '#05081c'; g.beginPath(); g.arc(cx + Math.cos(t * .6) * r * 2.1, cy, r, 0, 7); g.fill(); }
    else { g.fillStyle = '#021006'; g.fillRect(x0, y0, w, h); g.strokeStyle = '#5cff9d'; g.lineWidth = 2; g.beginPath(); for (let k = 0; k <= 200; k++) { const a = k / 200 * Math.PI * 2; const x = x0 + w / 2 + Math.sin(3 * a + t) * w * .4, y = y0 + h / 2 + Math.sin(2 * a) * h * .4; k ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
    g.fillStyle = 'rgba(0,0,0,.22)'; for (let y = y0; y < y0 + h; y += 3) g.fillRect(x0, y, w, 1);
    g.restore();
    screens[i].t.needsUpdate = true;
  }

  function makeTV(id, ghost) {
    const [w, h, d] = DIMS[id];
    const geo = new THREE.BoxGeometry(w, h, d);
    const maps = [TEX.dial, TEX.speaker, TEX.top, TEX.bottom, screens[id].t, TEX.back]; // +x -x +y -y +z -z
    const mats = maps.map((m, k) => ghost
      ? new THREE.MeshBasicMaterial({ map: m, transparent: true, opacity: .5, depthWrite: false })
      : new THREE.MeshStandardMaterial({ map: m, roughness: .75, emissive: k === 4 ? 0xffffff : 0x000000, emissiveMap: k === 4 ? m : null, emissiveIntensity: k === 4 ? .85 : 0 }));
    const mesh = new THREE.Mesh(geo, mats);
    if (ghost) { const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0x39e07a })); mesh.add(e); mesh.userData.edge = e; }
    return mesh;
  }
  const quatOf = O => new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().set(O[0], O[1], O[2], 0, O[3], O[4], O[5], 0, O[6], O[7], O[8], 0, 0, 0, 0, 1));

  // ---------- game state ----------
  let placed = [];        // {id, O, p, mesh, born}
  let sel = 0, selO = I, target = null, ghost = null, ghostInfo = null;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const tray = $('tray');
  DIMS.forEach((d, i) => {
    const b = document.createElement('button'); b.className = 'tv'; b.id = 'tv' + i;
    b.innerHTML = `<b>${NAMES[i]}</b><span>${d[0]}×${d[1]}×${d[2]} · ${PROG[i]}</span>`;
    b.addEventListener('click', () => { if (placed.some(p => p.id === i)) return; select(i); });
    tray.appendChild(b);
  });

  function select(i) {
    sel = i; selO = I;
    if (ghost) scene.remove(ghost);
    ghost = i === null ? null : makeTV(i, true);
    if (ghost) { ghost.quaternion.copy(quatOf(selO)); scene.add(ghost); }
    updateGhost(); ui();
  }

  function updateGhost() {
    ghostInfo = null;
    if (sel === null || !ghost) return;
    let p;
    if (!placed.length) p = [0, 0, 0];
    else if (target) {
      const P = placed[target.idx], hp = half(P.O, DIMS[P.id]), hc = half(selO, DIMS[sel]);
      const k = target.n.findIndex(v => v !== 0), s = target.n[k];
      p = P.p.slice(); p[k] += s * (hp[k] + hc[k]);
    }
    if (!p) { ghost.visible = false; return; }
    const hc = half(selO, DIMS[sel]);
    const hit = placed.some(q => { const hq = half(q.O, DIMS[q.id]); return [0, 1, 2].every(a => Math.abs(p[a] - q.p[a]) < hc[a] + hq[a]); });
    ghost.visible = true;
    ghost.position.set(p[0], p[1], p[2]);
    ghost.userData.edge.material.color.set(hit ? 0xff4466 : 0x39e07a);
    const touch = target ? FACE[mtv(selO, target.n.map(v => -v)).join(',')] : null;
    ghostInfo = { p, ok: !hit, touch };
  }

  function rotate(R) {
    if (sel === null) return;
    selO = mul(R, selO);
    if (reduce) ghost.quaternion.copy(quatOf(selO));
    updateGhost(); ui();
  }

  function attach() {
    if (!ghostInfo || !ghostInfo.ok) return;
    const mesh = makeTV(sel, false);
    mesh.quaternion.copy(quatOf(selO));
    mesh.position.set(...ghostInfo.p);
    mesh.scale.setScalar(reduce ? 1 : .6);
    scene.add(mesh);
    placed.push({ id: sel, O: selO, p: ghostInfo.p, mesh, born: performance.now() });
    target = null;
    const next = DIMS.findIndex((_, i) => !placed.some(q => q.id === i));
    select(next < 0 ? null : next);
  }

  function undo() {
    const last = placed.pop(); if (!last) return;
    scene.remove(last.mesh); target = null; select(last.id);
  }

  function clearBoard() {
    placed.forEach(q => scene.remove(q.mesh)); placed = []; target = null; select(0);
  }

  let flashTimer, busy = false;
  function flash(kind, title, big, sub, ms) {
    const f = $('flash'); f.className = 'flash show ' + kind;
    $('flashT').textContent = title; $('flashM').textContent = big; $('flashS').textContent = sub;
    clearTimeout(flashTimer); flashTimer = setTimeout(() => f.classList.remove('show'), ms);
  }

  // ---------- fireworks ----------
  const fx = $('fx'), fg = fx.getContext('2d');
  const sparks = [], shells = [];
  const FX_COL = ['#f5d000', '#3fd0e0', '#39e07a', '#d040c0', '#ff4466', '#ffffff', '#c0c0c0'];
  function fireworks(m) {
    if (reduce) return;
    const count = { 2: 3, 4: 6, 8: 10, 10: 24 }[m];
    for (let i = 0; i < count; i++) shells.push({ at: performance.now() + i * (m === 10 ? 130 : 180), x: .15 + Math.random() * .7, y: .15 + Math.random() * .4, big: m >= 8 });
  }
  function drawFx(now) {
    const r = fx.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    if (fx.width !== Math.round(r.width * dpr)) { fx.width = Math.round(r.width * dpr); fx.height = Math.round(r.height * dpr); }
    const W = fx.width, H = fx.height;
    for (let i = shells.length - 1; i >= 0; i--) {
      const s = shells[i]; if (now < s.at) continue; shells.splice(i, 1);
      const col = FX_COL[Math.floor(Math.random() * FX_COL.length)], n = s.big ? 90 : 55, sp = (s.big ? 7 : 5) * dpr;
      for (let k = 0; k < n; k++) { const a = Math.random() * Math.PI * 2, v = sp * (.35 + Math.random() * .65); sparks.push({ x: s.x * W, y: s.y * H, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col: Math.random() < .2 ? '#ffffff' : col }); }
    }
    fg.clearRect(0, 0, W, H);
    if (!sparks.length) return;
    fg.globalCompositeOperation = 'lighter';
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx; p.y += p.vy; p.vx *= .965; p.vy = p.vy * .965 + .09 * dpr; p.life -= .014;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      fg.globalAlpha = p.life; fg.fillStyle = p.col;
      fg.beginPath(); fg.arc(p.x, p.y, 2.2 * dpr * (.5 + p.life * .5), 0, 7); fg.fill();
    }
    fg.globalAlpha = 1; fg.globalCompositeOperation = 'source-over';
  }

  function submit() {
    if (placed.length < 5 || busy) return;
    const s = signature(placed);
    if (hist.includes(s)) { score -= 5; flash('bad', 'UNCORRECT', '', '이미 만든 모양이에요  −5', 1300); save(); ui(); return; }
    hist.push(s);
    // highest open jackpot this sculpture satisfies
    const win = jackpots.filter(j => !j.hit && roll(j.seed, s) < tierOf(j.m).p).sort((a, b) => b.m - a.m)[0];
    let wait = 900;
    if (win) {
      win.hit = true;
      const gain = 10 * win.m; score += gain;
      wait = win.m === 10 ? 3400 : 2300;
      flash('good win t' + win.m, win.m === 10 ? 'JACKPOT ×10' : `×${win.m} 보너스`, `+${gain}`, `새 모양 #${hist.length} · 숨은 배치를 찾았어요!`, wait);
      fireworks(win.m);
    } else {
      score += 10;
      flash('good', 'CORRECT', '', `새 모양 #${hist.length}  +10`, 1300);
    }
    busy = true; save(); ui();
    setTimeout(() => { busy = false; clearBoard(); }, wait);
  }

  let resetArmed = false, resetTimer;
  function reset() {
    const b = $('reset');
    if (!resetArmed) { resetArmed = true; b.textContent = '정말 리셋? 한 번 더'; resetTimer = setTimeout(() => { resetArmed = false; b.textContent = '리셋'; }, 3000); return; }
    clearTimeout(resetTimer); resetArmed = false; b.textContent = '리셋';
    score = 0; hist = []; jackpots = makeJackpots(); save(); clearBoard();
  }

  function ui() {
    $('score').textContent = score; $('shapes').textContent = hist.length;
    $('jp').innerHTML = '<span>남은 숨은 배치</span>' + TIERS.map(t => {
      const left = jackpots.filter(j => j.m === t.m && !j.hit).length;
      return `<span class="${t.m === 10 ? 'top' : ''} ${left ? '' : 'gone'}"><b>${left}</b>${t.m === 10 ? '잭팟 ×10' : '×' + t.m}</span>`;
    }).join('');
    DIMS.forEach((_, i) => { const b = $('tv' + i); b.classList.toggle('done', placed.some(q => q.id === i)); b.classList.toggle('on', sel === i); });
    const st = $('status');
    if (placed.length === 5) st.textContent = '5대 완성! CORRECT를 눌러 제출하세요. 마음에 안 들면 되돌리기.';
    else if (sel === null) st.textContent = '아래에서 TV를 고르세요.';
    else if (!placed.length) st.textContent = `${NAMES[sel]} TV가 첫 번째예요. 돌려서 자세를 정하고 [놓기]를 누르세요.`;
    else if (!target) st.textContent = `${NAMES[sel]} TV를 붙일 면을 화면에서 탭하세요. 드래그하면 시점이 돌아가요.`;
    else if (!ghostInfo || !ghostInfo.ok) st.textContent = '다른 TV와 겹쳐서 붙일 수 없어요. 돌리거나 다른 면을 고르세요.';
    else st.textContent = `맞닿는 면: ${NAMES[sel]}의 ${ghostInfo.touch}. 회전해서 바꾸거나 [붙이기].`;
    $('attach').textContent = placed.length ? '붙이기' : '놓기';
    $('attach').disabled = !(ghostInfo && ghostInfo.ok);
    $('rotY').disabled = $('rotX').disabled = sel === null;
    $('undo').disabled = !placed.length;
    $('clear').disabled = !placed.length;
    $('correct').disabled = placed.length < 5 || busy;
  }

  $('rotY').addEventListener('click', () => rotate(RY));
  $('rotX').addEventListener('click', () => rotate(RX));
  $('attach').addEventListener('click', attach);
  $('undo').addEventListener('click', undo);
  $('clear').addEventListener('click', clearBoard);
  $('correct').addEventListener('click', submit);
  $('reset').addEventListener('click', reset);

  // tap a face to choose where to attach; drag to orbit
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let down = null;
  cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener('pointerup', e => {
    if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
    if (moved > 6 || sel === null || !placed.length) return;
    const r = cv.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(placed.map(q => q.mesh), false);
    if (!hits.length) return;
    const idx = placed.findIndex(q => q.mesh === hits[0].object);
    const ln = hits[0].face.normal; const local = [Math.round(ln.x), Math.round(ln.y), Math.round(ln.z)];
    target = { idx, n: mv(placed[idx].O, local) };
    updateGhost(); ui();
  });

  function resize() { const r = cv.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize);

  // ---------- loop ----------
  let frame = 0; const t0 = performance.now(); const focus = new THREE.Vector3();
  function loop(now) {
    const t = (now - t0) / 1000;
    if (frame++ % 2 === 0) DIMS.forEach((_, i) => drawScreen(i, t));
    if (ghost && !reduce) ghost.quaternion.slerp(quatOf(selO), .22);
    placed.forEach(q => { const k = Math.min(1, (now - q.born) / 350); const e = 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2); if (!reduce) q.mesh.scale.setScalar(.6 + .4 * e); });
    // keep the sculpture centred
    const pts = placed.map(q => q.mesh.position); if (ghost && ghost.visible) pts.push(ghost.position);
    focus.set(0, 0, 0); pts.forEach(p => focus.add(p)); if (pts.length) focus.divideScalar(pts.length);
    controls.target.lerp(focus, .06); controls.update();
    renderer.render(scene, camera);
    drawFx(now);
    requestAnimationFrame(loop);
  }
  resize(); select(0); ui(); requestAnimationFrame(loop);
})();
</script>

</body></html>
